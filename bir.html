<!doctype html>
<html class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .birthday-bg {
      background: radial-gradient(ellipse at center, #1a0533 0%, #0d001a 50%, #000000 100%);
      width: 100%; height: 100%; position: relative; overflow: hidden;
    }
    @keyframes floatUp {
      0% { transform: translateY(100%) rotate(0deg) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120%) rotate(360deg) scale(1); opacity: 0; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes candleFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1); opacity: 1; }
      25% { transform: scaleY(1.2) scaleX(0.8); opacity: 0.8; }
      50% { transform: scaleY(0.9) scaleX(1.1); opacity: 1; }
      75% { transform: scaleY(1.1) scaleX(0.9); opacity: 0.9; }
    }
    @keyframes cakeFloat {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-10px) rotateY(5deg); }
    }
    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 40px #ff1493; }
      50% { text-shadow: 0 0 20px #ffb6c1, 0 0 40px #ff69b4, 0 0 80px #ff1493, 0 0 100px #c71585; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-10%) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110%) rotate(720deg); opacity: 0.3; }
    }
    .rose { position: absolute; font-size: 2rem; animation: floatUp linear infinite; pointer-events: none; }
    .sparkle { position: absolute; width: 6px; height: 6px; background: gold; border-radius: 50%; animation: sparkle 2s infinite; }
    .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: confettiFall linear infinite; pointer-events: none; }
    .cake-container { animation: cakeFloat 3s ease-in-out infinite; perspective: 800px; transform-style: preserve-3d; }
    .candle-flame { animation: candleFlicker 0.3s infinite; }
    .title-text { font-family: 'Great Vibes', cursive; animation: textGlow 2s ease-in-out infinite; }
    .message-text { font-family: 'Poppins', sans-serif; }
    .music-btn { transition: all 0.3s; }
    .music-btn:hover { transform: scale(1.1); }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }
    .heartbeat { animation: heartBeat 1.5s infinite; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div class="birthday-bg" id="mainContainer"><!-- Roses container -->
   <div id="rosesContainer"></div><!-- Sparkles container -->
   <div id="sparklesContainer"></div><!-- Confetti container -->
   <div id="confettiContainer"></div><!-- Main content -->
   <div class="absolute inset-0 flex flex-col items-center justify-center z-10 px-4"><!-- Title -->
    <h1 id="titleText" class="title-text text-5xl md:text-7xl text-pink-300 mb-4 text-center">Happy Birthday!</h1><!-- 3D Cake -->
    <div class="cake-container mb-6">
     <div class="relative" style="transform-style: preserve-3d; transform: rotateX(5deg);"><!-- Cake layers -->
      <div class="relative mx-auto" style="width: 180px;"><!-- Top layer -->
       <div class="mx-auto rounded-lg relative" style="width: 100px; height: 40px; background: linear-gradient(135deg, #ff9a9e, #fad0c4); box-shadow: 0 8px 20px rgba(255,105,180,0.4), inset 0 -5px 10px rgba(0,0,0,0.1); border-radius: 10px 10px 5px 5px;"><!-- Candles -->
        <div class="absolute flex justify-around w-full" style="top: -35px; padding: 0 15px;">
         <div class="relative">
          <div style="width: 4px; height: 25px; background: linear-gradient(#fff, #ffd700); border-radius: 2px;"></div>
          <div class="candle-flame absolute" style="top: -12px; left: -4px; width: 12px; height: 16px; background: radial-gradient(ellipse, #fff 0%, #ffdd00 40%, #ff6600 70%, transparent 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; filter: blur(0.5px);"></div>
         </div>
         <div class="relative">
          <div style="width: 4px; height: 25px; background: linear-gradient(#fff, #ff69b4); border-radius: 2px;"></div>
          <div class="candle-flame absolute" style="top: -12px; left: -4px; width: 12px; height: 16px; background: radial-gradient(ellipse, #fff 0%, #ffdd00 40%, #ff6600 70%, transparent 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; filter: blur(0.5px); animation-delay: 0.1s;"></div>
         </div>
         <div class="relative">
          <div style="width: 4px; height: 25px; background: linear-gradient(#fff, #87ceeb); border-radius: 2px;"></div>
          <div class="candle-flame absolute" style="top: -12px; left: -4px; width: 12px; height: 16px; background: radial-gradient(ellipse, #fff 0%, #ffdd00 40%, #ff6600 70%, transparent 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; filter: blur(0.5px); animation-delay: 0.2s;"></div>
         </div>
        </div><!-- Frosting drips -->
        <div class="absolute w-full" style="bottom: -5px;">
         <div style="position:absolute; left:10px; width:8px; height:12px; background:#fff; border-radius:0 0 4px 4px;"></div>
         <div style="position:absolute; left:35px; width:6px; height:8px; background:#fff; border-radius:0 0 3px 3px;"></div>
         <div style="position:absolute; right:15px; width:7px; height:10px; background:#fff; border-radius:0 0 4px 4px;"></div>
        </div>
       </div><!-- Middle layer -->
       <div class="mx-auto mt-1 rounded-lg" style="width: 140px; height: 45px; background: linear-gradient(135deg, #a18cd1, #fbc2eb); box-shadow: 0 8px 20px rgba(161,140,209,0.4), inset 0 -5px 10px rgba(0,0,0,0.1); border-radius: 8px;">
        <div class="flex justify-around items-center h-full px-3"><span style="font-size: 14px;">🍓</span> <span style="font-size: 14px;">🫐</span> <span style="font-size: 14px;">🍓</span> <span style="font-size: 14px;">🫐</span>
        </div>
       </div><!-- Bottom layer -->
       <div class="mx-auto mt-1 rounded-lg" style="width: 180px; height: 50px; background: linear-gradient(135deg, #667eea, #764ba2); box-shadow: 0 12px 30px rgba(118,75,162,0.5), inset 0 -5px 10px rgba(0,0,0,0.2); border-radius: 8px;">
        <div class="flex justify-around items-center h-full px-4"><span style="font-size: 12px;">✨</span> <span style="font-size: 12px;">⭐</span> <span style="font-size: 12px;">✨</span> <span style="font-size: 12px;">⭐</span> <span style="font-size: 12px;">✨</span>
        </div>
       </div><!-- Plate -->
       <div class="mx-auto mt-1" style="width: 200px; height: 12px; background: linear-gradient(to bottom, #e0e0e0, #fff); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>
      </div>
     </div>
    </div><!-- Name -->
    <p id="nameText" class="message-text text-2xl md:text-3xl font-bold text-white mb-2 text-center heartbeat">My Love </p><!-- Message -->
    <p id="messageText" class="message-text text-lg md:text-xl text-pink-200 text-center max-w-md opacity-90">Wishing you a day filled with love, joy, and all the happiness in the world! 🎉</p><!-- Emoji row -->
    <div class="mt-4 flex gap-3 text-3xl"><span class="heartbeat" style="animation-delay: 0s;">🎂</span> <span class="heartbeat" style="animation-delay: 0.2s;">🎁</span> <span class="heartbeat" style="animation-delay: 0.4s;">🎈</span> <span class="heartbeat" style="animation-delay: 0.6s;">💖</span> <span class="heartbeat" style="animation-delay: 0.8s;">🥳</span>
    </div>
   </div><!-- Music button --> <button id="musicBtn" class="music-btn absolute top-4 right-4 z-20 bg-pink-600 hover:bg-pink-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg text-xl" onclick="toggleMusic()"> 🎵 </button>
  </div>
  <script>
    // Config
    const defaultConfig = {
      birthday_name: 'Dear Friend',
      wish_message: 'Wishing you a day filled with love, joy, and all the happiness in the world! 🎉',
      background_color: '#1a0533',
      text_color: '#f9a8d4',
      primary_action: '#db2777',
      surface_color: '#4c1d95',
      secondary_action: '#f472b6'
    };

    // Element SDK
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        document.getElementById('nameText').textContent = config.birthday_name || defaultConfig.birthday_name;
        document.getElementById('messageText').textContent = config.wish_message || defaultConfig.wish_message;
        document.getElementById('titleText').style.color = config.text_color || defaultConfig.text_color;
        document.getElementById('mainContainer').style.background = `radial-gradient(ellipse at center, ${config.background_color || defaultConfig.background_color}, #000)`;
        document.getElementById('musicBtn').style.backgroundColor = config.primary_action || defaultConfig.primary_action;
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => config.primary_action || defaultConfig.primary_action, set: (v) => { config.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); } },
          { get: () => config.secondary_action || defaultConfig.secondary_action, set: (v) => { config.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); } }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || 'Great Vibes',
          set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
        },
        fontSizeable: {
          get: () => config.font_size || 16,
          set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
        }
      }),
      mapToEditPanelValues: (config) => new Map([
        ['birthday_name', config.birthday_name || defaultConfig.birthday_name],
        ['wish_message', config.wish_message || defaultConfig.wish_message]
      ])
    });

    // Roses animation
    const roseEmojis = ['🌹', '🌸', '🌺', '💐', '🌷', '🏵️'];
    const rosesContainer = document.getElementById('rosesContainer');
    function createRose() {
      const rose = document.createElement('div');
      rose.className = 'rose';
      rose.textContent = roseEmojis[Math.floor(Math.random() * roseEmojis.length)];
      rose.style.left = Math.random() * 100 + '%';
      rose.style.animationDuration = (5 + Math.random() * 5) + 's';
      rose.style.animationDelay = Math.random() * 2 + 's';
      rose.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
      rosesContainer.appendChild(rose);
      setTimeout(() => rose.remove(), 12000);
    }
    setInterval(createRose, 600);

    // Sparkles
    const sparklesContainer = document.getElementById('sparklesContainer');
    function createSparkle() {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      s.style.background = ['gold', '#ff69b4', '#87ceeb', '#fff'][Math.floor(Math.random() * 4)];
      sparklesContainer.appendChild(s);
      setTimeout(() => s.remove(), 5000);
    }
    for (let i = 0; i < 30; i++) createSparkle();
    setInterval(createSparkle, 300);

    // Confetti
    const confettiContainer = document.getElementById('confettiContainer');
    const confettiColors = ['#ff69b4', '#ffd700', '#87ceeb', '#ff6347', '#98fb98', '#dda0dd', '#ff1493'];
    function createConfetti() {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      c.style.animationDuration = (3 + Math.random() * 4) + 's';
      c.style.animationDelay = Math.random() * 2 + 's';
      c.style.width = (5 + Math.random() * 10) + 'px';
      c.style.height = (5 + Math.random() * 10) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      confettiContainer.appendChild(c);
      setTimeout(() => c.remove(), 8000);
    }
    setInterval(createConfetti, 200);

    // Web Audio API - Birthday Music
    let audioCtx = null;
    let isPlaying = false;
    let musicTimeout = null;

    function playNote(ctx, freq, startTime, duration, type = 'sine', gain = 0.15) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, startTime);
      g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function playBirthdayMusic() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const now = ctx.currentTime;
      // Happy Birthday melody notes (simplified)
      const notes = [
        [262, 0.3], [262, 0.3], [294, 0.6], [262, 0.6], [349, 0.6], [330, 1.0],
        [262, 0.3], [262, 0.3], [294, 0.6], [262, 0.6], [392, 0.6], [349, 1.0],
        [262, 0.3], [262, 0.3], [523, 0.6], [440, 0.6], [349, 0.6], [330, 0.6], [294, 1.0],
        [466, 0.3], [466, 0.3], [440, 0.6], [349, 0.6], [392, 0.6], [349, 1.0]
      ];
      let t = now;
      notes.forEach(([freq, dur]) => {
        playNote(ctx, freq, t, dur, 'triangle', 0.12);
        playNote(ctx, freq * 0.5, t, dur, 'sine', 0.05);
        t += dur + 0.05;
      });
      const totalDuration = t - now;
      if (isPlaying) {
        musicTimeout = setTimeout(() => { if (isPlaying) playBirthdayMusic(); }, totalDuration * 1000 + 500);
      }
    }

    function toggleMusic() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('musicBtn');
      if (isPlaying) {
        btn.textContent = '🔊';
        playBirthdayMusic();
      } else {
        btn.textContent = '🎵';
        clearTimeout(musicTimeout);
      }
    }
  </script>

</html>
